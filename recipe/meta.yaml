{% set name = "nannyml" %}
{% set version = "0.13.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/NannyML/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 4abd56bbe355fbf3f8f878d6f0304635627a88f9ecf5cf19149722bfec9f09c5

build:
  number: 0
  entry_points:
    - nannyml=nannyml.cli.cli:cli
    - nml=nannyml.cli.cli:cli
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  # https://github.com/NannyML/nannyml/blob/4c86ee350dc541cb244f965cf555b4b2a004ae99/pyproject.toml#L31
  skip: true  # [py<39 or py>312]

requirements:
  host:
    - pip
    - poetry-core >=1.0.0
    - python
  run:
    - python
    - pandas >=1.4
    - python-dateutil >=2.8,<3.0.0
    - scikit-learn >=1.3
    - joblib >=1.1.0,<2.0
    - category_encoders >=2.3.0,<3.0.0
    - matplotlib-base >=3.7,<4.0
    - plotly >=5.6.0,<6.0
    - scipy >=1.9.2
    - numpy >=1.23
    - seaborn >=0.13,<0.14
    # kaleido same as python-kaleido
    - python-kaleido >=0.2,<0.3
    - pyarrow >=13.0.0
    - gcsfs >=2022.5.0
    - pydantic >=2.7
    - rich >=12.5
    - click >=8.1,<9.0
    - pyyaml >=6.0,<7.0
    - jinja2 >=3.1
    - pyfiglet >=0.8.post1,<0.9
    # pyfiglet 0.8.post1 requires pkg_resources, which was removed in setuptools 82.
    # setuptools is needed at runtime because the NannyML CLI imports pyfiglet.
    - setuptools <82
    - lightgbm >=3.3,<4.6
    - flaml >=2.3.3,<3.0
    # Required by flaml[automl].
    - xgboost >=0.90,<3.0
    - s3fs >=2022.8.2
    - apscheduler >=3.9.1,<4.0
    - segment-analytics-python >=2.3,<3.0
    - python-dotenv >=1.0,<2.0
    # NannyML uses statsmodels directly, but upstream does not declare it.
    - statsmodels
  run_constrained:
    # mkl variant pulls in intel-openmp which conflicts with llvm-openmp. i.e. force to use openblas variant of numpy, scipy, etc.
    - blas=*=openblas  # [osx and x86_64]
    - sqlmodel >=0.0.19,<0.0.20
    # psycopg2 on defaults is basically psycopg2-binary (without the bundled/vendored dependencies)
    - psycopg2 >=2.9.3,<3

# Ignore test modules requiring the legacy pytest-lazy-fixture plugin,
# which has no Python 3.12 build in Anaconda channels.
{% set ignored_tests = "" %}
{% set ignored_tests = "--ignore=tests/io/test_writers.py --ignore=tests/plots/comparison_plots.py" %}  # [py>=312]

# PyArrow Parquet export tests may fail on linux-aarch64 due to
# jemalloc memory allocation errors (Unsupported system page size).
# Deselect only the affected test until compatibility is revalidated.
{% set deselected_tests = "" %}
{% set deselected_tests = deselected_tests + " --deselect=tests/io/test_writers.py::test_raw_files_writer_raises_no_exceptions_when_writing_to_parquet" %}  # [linux and aarch64]
# Upstream CBPE tests have reproducible numerical expectation mismatches
# across supported platforms and Python versions. Upstream changed some
# expected values without corresponding changes to the metric calculations:
# https://github.com/NannyML/nannyml/commit/9a8dcfc3efab70f0e85ae24ecc45899e30a96ffa
# The failures also persist with scikit-learn <1.6.
# Temporarily deselect the affected cases while the upstream numerical
# discrepancies are investigated; retain all other CBPE tests.
{% set deselected_tests = deselected_tests + " --deselect=tests/performance_estimation/CBPE/test_cbpe_metrics.py::test_cbpe_for_multiclass_classification_with_timestamps" %}  # [linux and x86_64]
{% set deselected_tests = deselected_tests + " --deselect=tests/performance_estimation/CBPE/test_cbpe.py::test_cbpe_for_binary_classification_chunked_by_period_should_include_variable_sampling_error_for_metric[roc_auc-sampling_error0]" %}  # [not (linux and x86_64)]
{% set deselected_tests = deselected_tests + " --deselect=tests/performance_estimation/CBPE/test_cbpe_metrics.py::test_cbpe_for_multiclass_classification_with_timestamps[period_based_with_timestamp]" %}  # [not (linux and x86_64)]

test:
  source_files:
    - tests
  imports:
    - nannyml
  commands:
    - pip check
    - nannyml --help
    - nml --help
    - pytest -v tests {{ ignored_tests }} {{ deselected_tests }}
  requires:
    - pip
    - pytest >=6.2.4,<7
    - pytest-mock >=3.7.0,<4.0
    # Legacy pytest plugin (last released in 2020), unavailable for Python 3.12
    # in Anaconda and incompatible with pytest >=8.
    - pytest-lazy-fixture >=0.6.3,<1.0  # [py<312]

about:
  home: https://github.com/nannyml/nannyml
  doc_url: https://nannyml.readthedocs.io
  summary: NannyML, Your library for monitoring model performance.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  dev_url: https://github.com/nannyml/nannyml/
  description: NannyML is an open-source python library that allows you to estimate post-deployment model performance (without access to targets), detect data drift, and intelligently link data drift alerts back to changes in model performance.

extra:
  recipe-maintainers:
    - nnansters
    - thewchan
  # setuptools <82 is required at runtime because pyfiglet imports
  # pkg_resources, which was removed in setuptools 82.
  skip-lints:
    - python_build_tools_in_host
